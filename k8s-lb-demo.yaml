
apiVersion: v1
kind: ConfigMap
metadata:
  name: http-demo-server
data:
  server.py: |
    import json
    import os
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            result = {
                "message": "Hello from Kubernetes!",
                "pod": os.environ.get("POD_NAME", "unknown"),
                "pod_ip": os.environ.get("POD_IP", "unknown"),
                "node": os.environ.get("NODE_NAME", "unknown"),
                "path": self.path,
            }
            body = json.dumps(result, indent=2).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):
            print("%s - %s" % (self.address_string(), fmt % args))

    print("HTTP server listening on :8080", flush=True)
    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-demo
  labels:
    app: http-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: http-demo
  template:
    metadata:
      labels:
        app: http-demo
    spec:
      containers:
        - name: http-server
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/server.py"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: server-code
              mountPath: /app
              readOnly: true
      volumes:
        - name: server-code
          configMap:
            name: http-demo-server
---
apiVersion: v1
kind: Service
metadata:
  name: http-demo-clusterip
spec:
  type: ClusterIP
  selector:
    app: http-demo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: http-demo-nodeport
spec:
  type: NodePort
  selector:
    app: http-demo
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: http-demo-loadbalancer
spec:
  type: LoadBalancer
  selector:
    app: http-demo
  ports:
    - name: http
      port: 80
      targetPort: http
